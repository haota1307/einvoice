name: einvoice-provider

networks:
  einvoice-nw:
    driver: bridge
    name: einvoice_network

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - 27017:27017
    networks:
      - einvoice-nw
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./docker/docker_data/mongodb_data:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres_server
    ports:
      - 5432:5432
    networks:
      - einvoice-nw
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: einvoice_app
    volumes:
      - ./docker/docker_data/postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgAdmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    ports:
      - 5050:80
    depends_on:
      - postgres
    networks:
      - einvoice-nw
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@einvoice.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ./docker/docker_data/pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
